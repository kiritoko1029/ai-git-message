name: Publish Extension (VS Code Marketplace & Open VSX)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Build & Publish to VS Code Marketplace and Open VSX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies & compile
        run: |
          npm ci
          npm run compile

      - name: Package VSIX
        run: npx -y @vscode/vsce@latest package

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-git-message-vsix
          path: '*.vsix'

      - name: Create GitHub Release (on Tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true

      - name: Publish to VS Code Marketplace (Trusted Publishing OIDC)
        continue-on-error: true
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            npx -y @vscode/vsce@latest publish --packagePath *.vsix -p "$VSCE_PAT"
          else
            npx -y @vscode/vsce@latest publish --packagePath *.vsix --oidc
          fi

      - name: Publish to Open VSX Registry
        if: always()
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OVSX_PAT secret is not configured yet. Skipping Open VSX publish."
          else
            PUBLISHER=$(node -p "require('./package.json').publisher")
            npx -y ovsx create-namespace "$PUBLISHER" -p "$OVSX_PAT" || true
            npx -y ovsx publish *.vsix -p "$OVSX_PAT"
          fi
